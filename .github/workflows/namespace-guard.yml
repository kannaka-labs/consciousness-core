name: Namespace Guard

# Fails if documentation links back at a pre-migration namespace.
# The check lives in kannaka-labs/.github so the whole org shares one
# definition — including its exclusions for real social handles and
# externally registered badges.
#
# See kannaka-labs/.github#2.

on:
  pull_request:
    paths:
      - "**/*.md"
      # also on changes to the guard itself, so it self-verifies
      - ".github/workflows/namespace-guard.yml"
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - ".github/workflows/namespace-guard.yml"

permissions:
  contents: read

jobs:
  namespace:
    uses: kannaka-labs/.github/.github/workflows/namespace-guard.yml@main
